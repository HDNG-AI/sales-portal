name: Odelco staging checks

on:
  push:
    branches: [odelco-staging]
  pull_request:
    branches: [odelco-staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: odelco-staging-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: python3 -m unittest discover -s tests/operations -p 'test_staging_*.py'
      - name: Build without server credentials
        run: pnpm build
        env:
          NUXT_STORAGE_DRIVER: memory
          NUXT_STORAGE_REDIS_URL: ''

# The server polls successful push runs for the exact current branch revision.
# A passing PR run cannot authorize a deployment. Redis-backed image creation
# and acceptance happen on the server, using its existing configuration.
